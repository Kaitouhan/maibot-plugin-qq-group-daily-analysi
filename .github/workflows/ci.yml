name: 兼容性检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        sdk: ['2.16.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev]'
      - if: matrix.sdk != 'latest'
        run: pip install maibot-plugin-sdk==${{ matrix.sdk }}
      - run: ruff check .
      - run: ruff format --check --exclude vendor .
      - run: pyright --pythonpath python
      - run: pytest -q
