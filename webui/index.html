<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>群分析工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 var(--maibot-font-body,system-ui);color:var(--maibot-foreground,#e5e7eb);background:var(--maibot-background,#111827)}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0;font-size:26px}h2{font-size:18px}.muted{color:var(--maibot-muted,#9ca3af)}nav,.row{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}button,input,select,textarea{font:inherit;border:1px solid var(--maibot-border,#374151);border-radius:8px;padding:9px 12px;background:var(--maibot-surface,#1f2937);color:inherit;max-width:100%}button{cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#38bdf8;color:#38bdf8}button:disabled{opacity:.5}label{display:flex;flex-direction:column;gap:5px}textarea{width:100%;min-height:180px;font-family:monospace}.card{border:1px solid var(--maibot-border,#374151);border-radius:14px;padding:20px;margin:16px 0;background:var(--maibot-surface,#1f2937)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:500px;overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--maibot-border,#374151);overflow-wrap:anywhere}.table{overflow:auto}#message{position:sticky;top:0;padding:10px;background:var(--maibot-surface,#1f2937)}.error{color:#fca5a5}img{max-width:100%}#preview:empty{display:none}@media(max-width:640px){main{padding:12px}}
</style></head><body><main><h1>群分析工作台</h1><span class="muted">日报 · 增量 · 漫画 · 任务恢复</span><p id="message" role="status">正在连接麦麦…</p><nav id="nav"></nav>
<section class="card"><div class="row"><label>目标群<select id="group"><option value="">请选择群聊</option></select></label><label>日期<input id="day" type="date"></label><label>主题<select id="template"></select></label><label>格式<select id="output"><option value="image">图片</option><option value="text">文本</option><option value="html">HTML 文件</option><option value="markdown">Markdown</option><option value="pdf">PDF 文件</option></select></label></div><div class="row" id="operations"></div></section><button id="refresh">刷新当前页面</button><section id="content"></section><section id="preview" class="card"></section></main>
<script type="module">
const $=id=>document.getElementById(id),format=v=>JSON.stringify(v,null,2);
let section='overview',page=1,timer=null;
const labels={overview:'概览与任务',history:'历史日报',templates:'模板与资源',config:'完整配置',traces:'分析链路',logs:'日志',incremental:'增量批次',references:'漫画参考图'};
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
async function guard(fn){try{return await fn()}catch(e){message(e.message||String(e),true)}}
function button(text,fn){const b=el('button',text);b.onclick=()=>guard(async()=>{b.disabled=true;try{await fn()}finally{b.disabled=false}});return b}
function options(){return {stream_id:$('group').value,day:$('day').value,template:$('template').value,output:$('output').value}}
async function query(type,extra={}){return maibot.query('panel',{section:type,stream_id:$('group').value,day:$('day').value,page,...extra})}
async function operate(operation,extra={}){const r=await maibot.action('operate',{operation,...options(),...extra});message(r.message||'已提交');await refresh()}
function raw(v,parent){parent.append(el('pre',typeof v==='string'?v:format(v)))}
function card(title){const c=el('section');c.className='card';c.append(el('h2',title));$('content').append(c);return c}
function table(rows,actions,parent){if(!rows?.length){parent.append(el('p','暂无记录'));return}const wrap=el('div');wrap.className='table';const t=el('table'),keys=Object.keys(rows[0]).filter(k=>!['engine_payload','data','logs'].includes(k)).slice(0,8),head=el('tr');keys.forEach(k=>head.append(el('th',k)));t.append(head);for(const row of rows){const line=el('tr');keys.forEach(k=>line.append(el('td',typeof row[k]==='object'?format(row[k]):String(row[k]??''))));if(actions){const td=el('td');actions(row,td);line.append(td)}t.append(line)}wrap.append(t);parent.append(wrap)}
async function preview(job){const first=await query('artifact',{trace_id:job.id,page:1});if(first.size>16*1024*1024)throw Error('产物较大，请通过群文件查看');const parts=[];for(let i=0;i<first.chunks;i++){const r=i?await query('artifact',{trace_id:job.id,page:i+1}):first;parts.push(Uint8Array.from(atob(r.chunk),c=>c.charCodeAt(0)))}const box=$('preview');box.replaceChildren(el('h2',first.name));if(/\.(png|jpg|webp)$/i.test(first.name)){const img=el('img');img.alt='报告产物';img.src=URL.createObjectURL(new Blob(parts,{type:'image/png'}));img.onload=()=>URL.revokeObjectURL(img.src);box.append(img)}else if(/\.(txt|md|html)$/i.test(first.name))raw(await new Blob(parts).text(),box);else box.append(el('p','文件已生成，请通过群文件查看。'))}
async function refresh(){
 $('content').replaceChildren();
 if(section==='config'){const config=await query('config'),c=card('原插件完整配置'),select=el('select'),editor=el('textarea'),hint=el('p');c.append(el('p','选择字段并编辑 JSON 值。字符串需加双引号；星号密钥保留原值。'));for(const [g,s] of Object.entries(config.schema))for(const [k,d] of Object.entries(s.items||{})){const o=el('option',`${g} / ${d.description||k}`);o.value=`${g}.${k}`;select.append(o)}select.onchange=()=>{const [g,k]=select.value.split('.');editor.value=format(config.values[g][k]);hint.textContent=config.schema[g].items[k].hint||''};select.onchange();c.append(select,hint,editor,button('保存字段',()=>operate('save_config',{template:select.value,value:editor.value})));return}
 const r=await query(section);
 if(section==='overview'){raw(r.metrics,card('运行概览'));table([...(r.jobs||[])].reverse(),(j,td)=>{if(j.artifact)td.append(button('预览',()=>preview(j)));if(['running','queued'].includes(j.status))td.append(button('取消',()=>operate('cancel',{stream_id:j.stream_id})))},card('最近任务'))}
 else if(section==='history'){table(r.rows,(row,td)=>{const pick=()=>{$('group').value=row.stream_id;$('day').value=row.day};td.append(button('查看',async()=>{pick();raw((await query('report')).report,card('日报内容'))}),button('重渲染',async()=>{pick();await operate('rerender')}),button('删除',async()=>{await maibot.action('remove',{operation:'report',stream_id:row.stream_id,day:row.day});await refresh()}))},card('历史日报'))}
 else if(section==='templates'){table(r.rows,null,card('已安装主题'));const c=card('安装自定义模板'),url=el('input'),name=el('input'),zip=el('input');url.placeholder='https://github.com/作者/模板仓库';name.placeholder='模板名称（可选）';zip.type='file';zip.accept='.zip';c.append(url,name,button('从 GitHub 安装',()=>operate('template_install',{value:url.value,template:name.value})),el('p','或上传 ZIP（最大 4.5 MiB）'),zip,button('上传并安装 ZIP',async()=>{const f=zip.files[0];if(!f||f.size>4.5*1024*1024)throw Error('请选择不超过 4.5 MiB 的 ZIP');const bytes=new Uint8Array(await f.arrayBuffer()),identifier=crypto.randomUUID().replaceAll('-',''),size=36*1024,total=Math.ceil(bytes.length/size);let value='';for(let i=0;i<total;i++){const data=btoa(String.fromCharCode(...bytes.slice(i*size,(i+1)*size)));value=(await maibot.action('chunk',{identifier,index:i,total,data})).value;message(`上传 ${i+1}/${total}`)}await operate('template_install',{value,template:name.value})}),button('卸载所选模板',async()=>{await maibot.action('remove',{operation:'template',value:$('template').value});await refresh()}));const resources=card('字体与主题素材');resources.append(button('准备字体',()=>operate('fonts')),button('准备所选主题素材',()=>operate('resources')));raw({fonts:r.fonts,resources:r.resources},resources)}
 else if(section==='traces'){table(r.rows,(row,td)=>td.append(button('详情',async()=>raw(await query('trace',{trace_id:row.trace_id}),card('链路详情'))),button('从检查点恢复',()=>operate('resume',{trace_id:row.trace_id,stream_id:row.group_id})),button('删除',async()=>{await maibot.action('remove',{operation:'trace',value:row.trace_id});await refresh()})),card('分析链路'))}
 else if(section==='references'){const c=card('漫画角色参考图'),file=el('input'),name=el('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';name.placeholder='角色名称';table(r.rows,null,c);c.append(file,name,button('保存参考图',async()=>{if(!file.files[0])throw Error('请选择图片');const result=await maibot.upload('reference',file.files[0],{label:name.value});message(`${result.message}：${result.path}`);await refresh()}),el('p','将保存后的路径填入完整配置中的漫画角色方案；绘图供应商、角色和分镜提示词也在完整配置中设置。'))}
 else raw(r,card(labels[section]));
 if(['history','traces','logs'].includes(section)){const c=card('翻页');c.append(button('上一页',async()=>{page=Math.max(1,page-1);await refresh()}),el('span',` 第 ${page} 页 `),button('下一页',async()=>{page++;await refresh()}))}
}
for(const [key,label] of Object.entries(labels))$('nav').append(button(label,async()=>{section=key;page=1;for(const node of $('nav').children)node.setAttribute('aria-pressed',String(node.textContent===label));await refresh()}));
for(const [operation,label] of Object.entries({daily:'生成日报',comic:'生成漫画',incremental:'保存增量批次',final:'增量汇总',rerender:'重渲染日报',probe:'测试渲染'}))$('operations').append(button(label,()=>operate(operation)));
$('refresh').onclick=()=>guard(refresh);$('group').onchange=()=>guard(refresh);$('day').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());
await guard(async()=>{await maibot.ready;for(const row of (await query('groups')).rows){const o=el('option',`${row.group_name||row.group_id} · ${row.platform||'qq'}`);o.value=row.stream_id;$('group').append(o)}for(const row of (await query('templates')).rows){const o=el('option',row.name||row.id);o.value=row.id;$('template').append(o)}$('template').value='HatsuneMiku';await refresh();message('已连接。分析任务完成后会投递到所选群聊。');timer=setInterval(()=>{if(section==='overview'&&!document.hidden)guard(refresh)},5000)});
window.addEventListener('pagehide',()=>clearInterval(timer));
</script></body></html>
